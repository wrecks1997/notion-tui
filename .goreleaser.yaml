version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - repository:
      owner: wrecks1997
      name: homebrew-tap
    homepage: "https://github.com/wrecks1997/notion-tui"
    description: "Terminal UI for browsing Notion workspaces"
    license: "MIT"
    install: |
      bin.install "notion-tui"
    test: |
      assert_match "Configuration error", shell_output("#{bin}/notion-tui 2>&1", 1)
